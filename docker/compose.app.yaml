services:
  backend-fastapi:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+psycopg://pokemon:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/pokemon_db"
      RABBITMQ_URL: "amqp://pokemon:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/%2F"
      KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend-angular:
    build:
      context: ../frontend-angular
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      backend-fastapi:
        condition: service_healthy

  kafka-outbox-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.messaging.kafka_outbox_worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+psycopg://pokemon:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/pokemon_db"
      RABBITMQ_URL: "amqp://pokemon:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/%2F"
      KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka1:
        condition: service_started
      kafka2:
        condition: service_started
      kafka3:
        condition: service_started

  kafka-analytics-consumer:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.messaging.kafka_consumer"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+psycopg://pokemon:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/pokemon_db"
      RABBITMQ_URL: "amqp://pokemon:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/%2F"
      KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka1:
        condition: service_started
      kafka2:
        condition: service_started
      kafka3:
        condition: service_started

  rabbitmq-rewards-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.messaging.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+psycopg://pokemon:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/pokemon_db"
      RABBITMQ_URL: "amqp://pokemon:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/%2F"
      KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
